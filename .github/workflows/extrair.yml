name: Extrair projeto Ajuda Mutua

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Encontrar ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo ZIP encontrado"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Copiar arquivos
        run: |
          if [ -d "extracted/work" ]; then
            cp -r extracted/work/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Salvar projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar projeto Ajuda Mutua" || true
          git push
