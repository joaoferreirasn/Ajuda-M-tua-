name: Extrair projeto Ajuda Mutua

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -o grok-workspace.zip -d projeto

      - name: Copiar projeto para o repositorio
        run: |
          if [ -d "projeto/work" ]; then
            cp -r projeto/work/. .
          else
            cp -r projeto/. .
          fi

          rm -rf projeto
          rm -f grok-workspace.zip

      - name: Salvar projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair projeto Ajuda Mutua" || true
          git push
